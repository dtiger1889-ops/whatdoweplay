<title>Ready Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --ink:#1a2330; --muted:#66707f; --line:#d9dee6;
  --accent:#ff7a2f; --accent-ink:#ffffff; --good:#2f9e5f; --good-bg:#e4f5ea;
  --chip:#e8ecf1; --chip-on:#1a2330; --chip-on-ink:#ffffff; --rank:#c9d0da;
  --shadow:0 10px 30px rgba(26,35,48,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#161d27; --ink:#e6ebf2; --muted:#94a0b2; --line:#26303d;
  --accent:#ff8a45; --accent-ink:#1a1006; --good:#5fd08a; --good-bg:#15301f;
  --chip:#222c38; --chip-on:#e6ebf2; --chip-on-ink:#0f141b; --rank:#34404f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --ink:#e6ebf2; --muted:#94a0b2; --line:#26303d;
  --accent:#ff8a45; --accent-ink:#1a1006; --good:#5fd08a; --good-bg:#15301f;
  --chip:#222c38; --chip-on:#e6ebf2; --chip-on-ink:#0f141b; --rank:#34404f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 20px;font-size:14px}
.lobby{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:520px){.controls{grid-template-columns:1fr}}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:7px 4px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.picks{display:grid;gap:12px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.card.top{box-shadow:var(--shadow);border-color:var(--accent)}
.rank{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:28px;line-height:1;color:var(--rank);width:34px;text-align:center;padding-top:2px}
.card.top .rank{color:var(--accent)}
.name{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.card.top .name{font-size:24px}
.name a{color:inherit;text-decoration:none;border-bottom:2px solid var(--accent)}
.desc{margin:4px 0 8px;color:var(--muted);font-size:14px}
.why{margin:0 0 10px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--ink)}
.tag.all{background:var(--good-bg);color:var(--good);font-weight:600}
.hours{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hours b{color:var(--ink);font-weight:500}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.count{color:var(--muted);font-size:13px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btns{display:flex;gap:8px}.btn.ghost{background:var(--chip);color:var(--ink)}
.list{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.row:first-child{border-top:0}.row a{color:inherit;text-decoration:none;font-weight:600}.row small{color:var(--muted);display:block;font-size:12px}
.row .mini{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
@media (max-width:520px){.row{grid-template-columns:1fr}.row .mini{text-align:left}}
.foot{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out both}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <h1>Ready Check</h1>
  <p class="sub">Tick who's on. Say how much night you've got. Three games everyone here can launch right now.</p>

  <div class="lobby">
    <div>
      <div class="label">Who's on (you're always in)</div>
      <div class="chips" id="friends"></div>
    </div>
    <div class="controls">
      <div><div class="label">Time we've got</div><div class="seg" id="length" role="group"></div></div>
      <div><div class="label">Brain available</div><div class="seg" id="effort" role="group"></div></div>
      <div><div class="label">Together or against</div><div class="seg" id="mode" role="group"></div></div>
      <div><div class="label">Lean</div><div class="seg" id="lean" role="group"></div></div>
    </div>
  </div>

  <div class="picks" id="picks"></div>
  <div class="bar"><span class="count" id="count"></span><span class="btns"><button class="btn ghost" id="all" type="button">Show all</button><button class="btn" id="more" type="button">Different three</button></span></div>
  <div class="list" id="list" hidden></div>

  <p class="foot" id="foot"></p>
</div>

<script>
/*DATA-START*/
const DATA = {"generated":"","me":"me","friends":[],"games":[]};
/*DATA-END*/

const LENGTHS=[["30","30 min",30],["60","1 hour",60],["90","90 min",90],["120","2 h+",120],["any","Any",9999]];
const EFFORTS=[["low","Brain off"],["medium","Some"],["high","Full"],["any","Any"]];
const MODES=[["coop","Co-op"],["versus","Versus"],["either","Either"]];
const LEANS=[["safe","Safe bet"],["new","Something new"]];
const LEN_MIN={short:0,medium:60,long:120};
const EFF_RANK={low:0,medium:1,high:2,any:99};

const state={friends:new Set(DATA.friends.map(f=>f.persona)),length:"90",effort:"medium",mode:"coop",lean:"safe",page:0,all:false};
try{const s=JSON.parse(localStorage.getItem("readycheck")||"null");if(s){state.friends=new Set(s.friends);state.length=s.length;state.effort=s.effort;state.mode=s.mode;state.lean=s.lean;}}catch(e){}
function save(){try{localStorage.setItem("readycheck",JSON.stringify({friends:[...state.friends],length:state.length,effort:state.effort,mode:state.mode,lean:state.lean}))}catch(e){}}

function seg(id,opts,key){const el=document.getElementById(id);el.innerHTML="";opts.forEach(([v,label])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.id=id+"-"+v;b.setAttribute("aria-pressed",String(state[key]===v));b.onclick=()=>{state[key]=v;state.page=0;save();render();};el.appendChild(b);});}
function friendChips(){const el=document.getElementById("friends");el.innerHTML="";DATA.friends.forEach(f=>{const b=document.createElement("button");b.type="button";b.className="chip";b.id="friend-"+f.persona;b.textContent=f.persona;b.setAttribute("aria-pressed",String(state.friends.has(f.persona)));b.onclick=()=>{state.friends.has(f.persona)?state.friends.delete(f.persona):state.friends.add(f.persona);state.page=0;save();render();};el.appendChild(b);});}

function candidates(){
  const who=[...state.friends];const mins=state.length==="any"?9999:Number(state.length);
  return DATA.games.filter(g=>{
    if(!who.every(p=>g.owners.includes(p)))return false;
    if(state.mode!=="either"&&g.mode!=="both"&&g.mode!==state.mode)return false;
    if(LEN_MIN[g.length]>mins)return false;
    if(EFF_RANK[g.effort]>EFF_RANK[state.effort])return false;
    return true;
  }).map(g=>{const party=[DATA.me,...who];const hrs=party.reduce((a,p)=>a+(g.hours[p]||0),0);return {...g,partyHours:hrs,party};})
  .sort((a,b)=>state.lean==="safe"?(b.partyHours-a.partyHours)||(b.owners.length-a.owners.length):(a.partyHours-b.partyHours)||(b.owners.length-a.owners.length));
}

function why(g){
  const who=g.party.filter(p=>p!==DATA.me);
  const played=g.party.filter(p=>(g.hours[p]||0)>=5);
  let s=g.note?g.note+" ":"";
  if(state.lean==="safe"&&played.length>1)s+=`${played.length===g.party.length?"Everyone here":played.join(", ")} already ${played.length>1?"have":"has"} hours in it.`;
  else if(state.lean==="new")s+=played.length===0?"Nobody here has really touched it.":`Only ${played.join(", ")} ${played.length>1?"have":"has"} real time in it.`;
  if(g.teach)s+=` About ${g.teach} min to get a newcomer going.`;
  return s.trim();
}

function render(){
  friendChips();seg("length",LENGTHS,"length");seg("effort",EFFORTS,"effort");seg("mode",MODES,"mode");seg("lean",LEANS,"lean");
  const all=candidates();const el=document.getElementById("picks");el.innerHTML="";
  const start=(state.page*3)%Math.max(all.length,1);const three=all.slice(start,start+3);
  if(three.length<3&&all.length>3)three.push(...all.slice(0,3-three.length));
  if(all.length===0){el.innerHTML=`<div class="empty">Nothing fits everyone at this setting. Try "Either", give it more time, or untick one person.</div>`;}
  three.forEach((g,i)=>{
    const c=document.createElement("article");c.className="card"+(i===0?" top":"");
    const everyone=DATA.friends.every(f=>g.owners.includes(f.persona));
    const modeTxt=g.mode==="both"?"Co-op or versus":g.mode==="coop"?"Co-op":"Versus";
    const lenTxt={short:"Short sessions",medium:"About 90 min",long:"Long haul"}[g.length];
    const effTxt={low:"Brain off",medium:"Some brain",high:"Full brain"}[g.effort];
    c.innerHTML=`<div class="rank">${i+1}</div><div>
      <h2 class="name"><a href="https://store.steampowered.com/app/${g.appid}/" target="_blank" rel="noopener">${g.name}</a></h2>
      <p class="desc">${g.desc||""}</p>
      <div class="tags">${everyone?'<span class="tag all">Everyone on the roster owns it</span>':""}<span class="tag">${modeTxt}</span><span class="tag">${lenTxt}</span><span class="tag">${effTxt}</span></div>
      <p class="why">${why(g)}</p>
      <div class="hours">${g.party.map(p=>`<span>${p} <b>${fmt(g.hours[p]||0)}</b></span>`).join("")}</div>
    </div>`;
    el.appendChild(c);
  });
  document.getElementById("count").textContent=all.length?`${all.length} game${all.length===1?"":"s"} fit this group and mood`:"";
  document.getElementById("more").hidden=all.length<=3||state.all;
  document.getElementById("all").hidden=all.length<=3;
  document.getElementById("all").textContent=state.all?"Back to three":`Show all ${all.length}`;
  const list=document.getElementById("list");list.hidden=!state.all;
  if(state.all){el.innerHTML="";list.innerHTML=all.map(g=>{const lenTxt={short:"short",medium:"~90 min",long:"long"}[g.length];const effTxt={low:"brain off",medium:"some brain",high:"full brain"}[g.effort];const modeTxt=g.mode==="both"?"co-op/versus":g.mode;
    return `<div class="row"><div><a href="https://store.steampowered.com/app/${g.appid}/" target="_blank" rel="noopener">${g.name}</a><small>${g.desc||""}</small></div><div class="mini">${modeTxt} · ${lenTxt} · ${effTxt}<br>${g.owners.length===DATA.friends.length+1?"everyone":g.owners.filter(o=>o!==DATA.me).join(", ")}</div></div>`;}).join("");}
  document.getElementById("foot").textContent=`Ownership and hours from the Steam API, snapshot ${DATA.generated||"(not yet built)"}. Length and effort tags are hand-set in feel_tags.csv; fix them there and rebuild.`;
}
function fmt(h){return h>=100?Math.round(h)+"h":h>=10?h.toFixed(0)+"h":h>0?h.toFixed(1)+"h":"0h"}
document.getElementById("more").onclick=()=>{state.page++;render();};
document.getElementById("all").onclick=()=>{state.all=!state.all;render();};
render();
</script>
